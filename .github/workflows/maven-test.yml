name: Java Maven Build and Test

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test:
    name: Build and Test with Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Run Maven test
        run: mvn clean test --batch-mode

      - name: Upload Surefire Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maven-test-report
          path: target/surefire-reports/
